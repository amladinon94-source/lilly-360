          <!-- ============ DETALLE (pieza gráfica) · una tarea: leer el algoritmo ============
               Responsivo por container queries: @3xl = tablet (ramas en 2 columnas, todas abiertas),
               @6xl = escritorio (columna lateral de 320 con el contenido relacionado). -->
          <div x-show="pantalla === 'detalle'" class="px-5 pb-32 @3xl:mx-auto @3xl:w-full @3xl:max-w-[960px] @6xl:max-w-[1000px]">

            <!-- Cabecera de la figura. Guardar y compartir viven en la nav bar del cascarón (M1): aquí no se repiten. -->
            <div class="pt-2 @3xl:pt-4">
              <span class="glass inline-flex items-center gap-1.5 h-7 px-3 rounded-full text-[12px] font-semibold text-ink-2">
                <i :data-lucide="iconoTipo(detalle.tipo)" class="h-3.5 w-3.5"></i><span x-text="detalle.tipo"></span>
              </span>
              <h1 class="mt-3 text-[26px] @6xl:text-[32px] font-bold leading-[1.2] tracking-[-0.02em] text-ink" x-text="detalle.titulo"></h1>
              <p class="mt-2 text-[15px] @6xl:text-[16px] text-ink-2">Comité editorial Lilly · <span x-text="detalle.fecha"></span> · <span x-text="detalle.minutos + ' min'"></span></p>
            </div>

            <!-- Árbol de decisión (M3). En iPhone todas las ramas van abiertas: en consulta cada toque cuesta y los doce
                 nodos caben en pantalla y media. Cada cabecera se puede cerrar por separado (`abiertas` es un conjunto de
                 índices) y los chips de salto llevan a la rama con scroll suave. El estado es local y se reinicia con cada
                 pieza gracias al x-for con clave. En tablet y escritorio hay espacio: grilla con todo abierto y sin chips. -->
            <template x-for="k in [enfermedad + '|' + detalle.titulo]" :key="k">
              <div x-data="{
                     abiertas: algoritmo.ramas.map((_, i) => i),
                     get fija() { return dispositivo !== 'iphone'; },
                     abre(i) { return this.fija || this.abiertas.includes(i); },
                     alterna(i) { if (this.fija) return; this.abiertas = this.abiertas.includes(i) ? this.abiertas.filter(x => x !== i) : [...this.abiertas, i]; },
                     salta(i) { if (!this.abiertas.includes(i)) this.abiertas = [...this.abiertas, i]; this.$root.querySelectorAll('[data-rama]')[i].scrollIntoView({ behavior: 'smooth', block: 'start' }); }
                   }">

                <!-- Chips de salto: una fila con scroll horizontal, solo donde el árbol no cabe en una pantalla -->
                <div class="mt-4 -mx-5 px-5 flex gap-2 overflow-x-auto scroll-hide @3xl:hidden">
                  <template x-for="(r, i) in algoritmo.ramas" :key="'c' + r.nombre">
                    <button @click="salta(i)" class="ios-chip glass press shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink/30">
                      <span class="h-2 w-2 rounded-full" :class="r.color"></span><span x-text="r.nombre"></span>
                    </button>
                  </template>
                </div>

                <!-- Nodo raíz como pastilla -->
                <div class="mt-6 @3xl:mt-9 flex justify-center">
                  <span class="glass-strong inline-flex items-center justify-center min-h-[44px] max-w-full px-5 py-2 rounded-full text-[15px] @6xl:text-[16px] leading-snug font-semibold text-ink text-center" x-text="algoritmo.raiz"></span>
                </div>
                <div class="flex justify-center"><span class="block h-5 w-[2px] rounded-full bg-[rgba(60,60,67,.18)]"></span></div>

                <!-- Ramas: una tarjeta de vidrio por rama, con su color como punto a la izquierda.
                     La tarjeta no lleva overflow-hidden porque la cabecera es sticky y el recorte la desactivaría. -->
                <div class="space-y-3 @3xl:space-y-0 @3xl:grid @3xl:grid-cols-2 @3xl:gap-4 stagger">
                  <template x-for="(r, i) in algoritmo.ramas" :key="r.nombre">
                    <div class="glass rounded-3xl scroll-mt-2" data-rama>
                      <button @click="alterna(i)"
                              class="ios-row min-h-[60px] py-3.5 rounded-t-3xl sticky top-0 z-10 bg-white/90 backdrop-blur-xl transition-colors active:bg-white @3xl:static @3xl:pointer-events-none @3xl:bg-transparent @3xl:backdrop-blur-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ink/30"
                              :class="abre(i) ? '' : 'rounded-b-3xl'"
                              :aria-expanded="abre(i) ? 'true' : 'false'">
                        <span class="h-3 w-3 shrink-0 rounded-full ring-4 ring-white/70" :class="r.color"></span>
                        <span class="flex-1 min-w-0">
                          <span class="block text-[17px] font-semibold text-ink leading-tight" x-text="r.nombre"></span>
                          <!-- Cerrada: el primer nodo truncado dice qué hay dentro; abierta: cuántos pasos son -->
                          <span class="block text-[13px] @6xl:text-[14px] text-ink-2 truncate" x-text="abre(i) ? r.nodos.length + ' pasos' : r.nodos[0]"></span>
                        </span>
                        <i data-lucide="chevron-down" class="h-5 w-5 shrink-0 text-ink-3 transition-transform duration-300 ease-[cubic-bezier(.2,.8,.2,1)] @3xl:hidden" :class="abre(i) ? 'rotate-180' : ''"></i>
                      </button>
                      <!-- Despliegue con grid-template-rows: anima la altura real sin adivinar un max-height -->
                      <div class="grid transition-[grid-template-rows] duration-300 ease-[cubic-bezier(.2,.8,.2,1)]" :class="abre(i) ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'">
                        <div class="min-h-0 overflow-hidden rounded-b-3xl">
                          <ol class="border-t border-sep">
                            <template x-for="(n, j) in r.nodos" :key="n">
                              <li class="flex items-start gap-3 px-4 py-3.5 border-t border-sep first:border-t-0">
                                <span class="mt-[3px] inline-flex h-5 w-5 shrink-0 items-center justify-center rounded-full text-[11px] font-semibold" :class="r.suave" x-text="j + 1"></span>
                                <span class="text-[15px] @6xl:text-[16px] leading-[1.45] text-ink" x-text="n"></span>
                              </li>
                            </template>
                          </ol>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- Pie de la figura y lateral. En escritorio, dos columnas: 640 de lectura y 320 lateral pegajosa.
                 En tablet y iPhone, todo apilado en el mismo orden. -->
            <div class="mt-7 @3xl:mt-9 @3xl:max-w-[640px] @6xl:max-w-none @6xl:grid @6xl:grid-cols-[minmax(0,640px)_320px] @6xl:justify-between @6xl:gap-10 @6xl:items-start">

              <div>
                <!-- Notas y referencia -->
                <div class="px-1 space-y-1.5 text-[13px] @6xl:text-[14px] leading-relaxed text-ink-2">
                  <template x-for="n in algoritmo.notas" :key="n"><p x-text="n"></p></template>
                  <p class="pt-2"><span class="font-semibold text-ink">Referencia.</span> <span x-text="algoritmo.referencia"></span></p>
                </div>

                <!-- Aviso editorial como fila discreta de vidrio -->
                <div class="glass ios-list mt-5">
                  <div class="ios-row py-3.5">
                    <i data-lucide="info" class="h-5 w-5 shrink-0 text-ink-3"></i>
                    <span class="text-[13px] @6xl:text-[14px] leading-snug text-ink-2">Contenido de referencia adaptado por el comité editorial. Pendiente de aprobación médica y regulatoria.</span>
                  </div>
                </div>
              </div>

              <div class="mt-9 @6xl:mt-0 @6xl:sticky @6xl:top-24">
                <!-- Contenido relacionado -->
                <p class="px-4 pb-2.5 text-[13px] @6xl:text-[14px] font-medium text-ink-2">Contenido relacionado</p>
                <div class="glass ios-list">
                  <template x-for="c in relacionados" :key="'r' + c.titulo">
                    <button @click="abrirDetalle(c)" class="ios-row py-3.5 press active:bg-black/[.04] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ink/30">
                      <span class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/80 border border-white/90 shadow-sm text-ink-2">
                        <i :data-lucide="iconoTipo(c.tipo)" class="h-[18px] w-[18px]"></i>
                      </span>
                      <span class="flex-1 min-w-0">
                        <span class="text-[17px] @6xl:text-[16px] font-semibold leading-[1.3] text-ink line-clamp-2" x-text="c.titulo"></span>
                        <span class="mt-1 block text-[13px] @6xl:text-[14px] text-ink-2" x-text="c.tipo + ' · ' + c.minutos + ' min · ' + c.fecha"></span>
                      </span>
                      <i data-lucide="chevron-right" class="h-5 w-5 shrink-0 text-ink-3"></i>
                    </button>
                  </template>
                </div>
              </div>

            </div>

          </div>
