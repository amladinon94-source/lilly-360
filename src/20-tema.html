          <!-- ============ TEMA (subtemáticas) · una tarea: elegir qué necesito de esta enfermedad ============
               Solo iPad y escritorio: en iPhone esta misma tarea vive en la hoja inferior (src/80-shell-cierre.html).
               Responsivo por container queries: @3xl = tablet (grilla de 2 tarjetas), @6xl = escritorio (3 columnas). -->
          <div x-show="pantalla === 'tema' && dispositivo !== 'iphone'" class="px-5 pb-40 @3xl:mx-auto @3xl:w-full @3xl:max-w-[880px] @6xl:max-w-[1120px]">

            <!-- Título grande iOS: vive en el contenido, la barra del cascarón lo compacta al hacer scroll -->
            <div class="pt-2 @3xl:pt-4">
              <h1 class="ios-large-title @6xl:text-[40px]" x-text="enf.nombre"></h1>
              <p class="mt-1.5 text-[15px] @6xl:text-[16px] text-ink-2">Búsqueda rápida</p>
            </div>

            <!-- Segmented control: la pastilla blanca es un solo elemento que se desliza al índice del tab.
                 Teclado (B8): las flechas mueven el tab y el foco lo sigue; solo el activo entra en el orden de tabulación. -->
            <div class="glass ios-segmented mt-6 @3xl:mt-8 @3xl:max-w-[480px]" role="tablist"
                 x-data="{ mover(d) { const i = tabs.findIndex(t => t.id === tab); tab = tabs[(i + d + tabs.length) % tabs.length].id; $nextTick(() => $el.querySelector('[aria-selected=true]').focus()); } }"
                 @keydown.arrow-right.prevent="mover(1)" @keydown.arrow-left.prevent="mover(-1)">
              <span aria-hidden="true"
                    class="absolute top-[3px] bottom-[3px] left-[3px] rounded-full bg-white shadow-pill transition-transform duration-300 ease-[cubic-bezier(.2,.8,.2,1)]"
                    :style="'width: calc((100% - 6px) / ' + tabs.length + '); transform: translateX(' + (tabs.findIndex(t => t.id === tab) * 100) + '%)'"></span>
              <template x-for="t in tabs" :key="t.id">
                <button role="tab" @click="tab = t.id" class="ios-segment aria-selected:!bg-transparent aria-selected:!shadow-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink/30"
                        :aria-selected="tab === t.id ? 'true' : 'false'" :tabindex="tab === t.id ? 0 : -1" x-text="t.nombre"></button>
              </template>
            </div>

            <!-- Grilla de tarjetas. El x-for con [tab] recrea el grupo al cambiar de pestaña, y con eso se vuelve
                 a disparar la entrada escalonada. -->
            <template x-for="k in [tab]" :key="k">
              <div class="mt-6 @3xl:mt-8">
                <p class="px-4 @3xl:px-1 pb-2.5 text-[13px] @6xl:text-[14px] font-medium text-ink-2">
                  <span x-text="contenidoTema.length"></span> contenidos · Comité editorial Lilly
                </p>

                <!-- Tablet y escritorio: grilla de tarjetas -->
                <div class="grid @3xl:grid-cols-2 @6xl:grid-cols-3 gap-4 stagger">
                  <template x-for="c in contenidoTema" :key="'g' + c.titulo">
                    <button @click="abrirDetalle(c)" class="glass rounded-3xl p-5 min-h-[150px] flex flex-col text-left press active:bg-white/80 transition-colors">
                      <span class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/80 border border-white/90 shadow-sm text-ink-2">
                        <i :data-lucide="iconoTipo(c.tipo)" class="h-[18px] w-[18px]"></i>
                      </span>
                      <span class="mt-4 text-[17px] font-semibold leading-[1.3] text-ink line-clamp-2" x-text="c.titulo"></span>
                      <span class="mt-auto pt-3 block text-[13px] @6xl:text-[14px] text-ink-2" x-text="c.tipo + ' · ' + c.minutos + ' min · ' + c.fecha"></span>
                    </button>
                  </template>
                </div>
              </div>
            </template>

          </div>
